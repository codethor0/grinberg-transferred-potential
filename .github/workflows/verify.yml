name: Verify release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: >-
          python -m pip install
          numpy==2.4.4
          scipy==1.18.1
          lxml==6.1.0
          pillow==12.2.0
          pypdf==6.10.2

      - name: Verify tracked release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/benchmark"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/release"
          python "$RUNNER_TEMP/release/reproducibility/verify_release.py" \
            --root "$RUNNER_TEMP/release" \
            --scratch-parent "$RUNNER_TEMP/benchmark" \
            --output "$RUNNER_TEMP/release-checks.json"
